apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-test-rustfs
  namespace: default
  labels:
    app: longhorn-test-rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: longhorn-test-rustfs
  template:
    metadata:
      labels:
        app: longhorn-test-rustfs
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoExecute"
      - key: "node-role.kubernetes.io/etcd"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/etcd"
        operator: "Exists"
        effect: "NoExecute"
      volumes:
      - name: rustfs-volume
        emptyDir: {}
      - name: rustfs-certificates
        secret:
          secretName: rustfs-secret
          items:
          - key: AWS_CERT
            path: rustfs_cert.pem
          - key: AWS_CERT_KEY
            path: rustfs_key.pem
      # RustFS has no bucket auto-provisioning; a directory at the volume root is a bucket.
      initContainers:
      - name: create-backupbucket
        image: rustfs/rustfs:1.0.0
        command: ["sh", "-c", "mkdir -p /data/backupbucket"]
        volumeMounts:
        - name: rustfs-volume
          mountPath: "/data"
      containers:
      - name: rustfs
        image: rustfs/rustfs:1.0.0
        env:
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-secret
              key: AWS_ACCESS_KEY_ID
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-secret
              key: AWS_SECRET_ACCESS_KEY
        - name: RUSTFS_VOLUMES
          value: "/data"
        - name: RUSTFS_ADDRESS
          value: "0.0.0.0:9000"
        - name: RUSTFS_CONSOLE_ENABLE
          value: "false"
        - name: RUSTFS_TLS_PATH
          value: "/opt/tls"
        ports:
        - containerPort: 9000
        readinessProbe:
          httpGet:
            path: /health
            port: 9000
            scheme: HTTPS
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: rustfs-volume
          mountPath: "/data"
        - name: rustfs-certificates
          mountPath: "/opt/tls"
          readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-service
  namespace: default
spec:
  selector:
    app: longhorn-test-rustfs
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
  sessionAffinity: ClientIP
