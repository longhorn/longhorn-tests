apiVersion: v1
kind: Pod
metadata:
  name: hugepage-holder
  namespace: default
  labels:
    app: hugepage-holder
    test.longhorn.io: e2e
spec:
  nodeName: NODE_NAME
  containers:
    - name: c
      image: public.ecr.aws/docker/library/busybox:1.34.1
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: hugepages-2mi
          mountPath: /hugepages-2Mi
      resources:
        limits:
          hugepages-2Mi: 4Mi
          memory: 64Mi
        requests:
          hugepages-2Mi: 4Mi
          memory: 64Mi
  volumes:
    - name: hugepages-2mi
      emptyDir:
        medium: HugePages-2Mi
